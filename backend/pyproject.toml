[project]
name = "options-platform-backend"
version = "0.1.0"
description = "Option analytics platform backend (forward factor screener)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "alpaca-py>=0.30",
    "httpx>=0.27",
    "pandas>=2.2",
    "lxml>=5.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
